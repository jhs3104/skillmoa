name: Collect skills

# push 트리거를 두지 않는다. 이 워크플로가 만든 커밋이 다시 실행을 부르면 루프가 된다.
on:
  # 첫 묶음을 검수한 뒤 예약을 켠다.
  # schedule:
  #   - cron: "17 */3 * * *" # 3시간마다. 일요일 18시 UTC 실행만 weekly가 된다
  workflow_dispatch:
    inputs:
      mode:
        description: 실행 모드
        type: choice
        default: auto
        options: [auto, bootstrap, daily, weekly]
      refresh_prompt:
        description: 이전 프롬프트 버전의 요약도 다시 만든다 (호출 상한 안에서 순위 순)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: collector
          enable-cache: true
          cache-dependency-glob: collector/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

      - name: Choose mode
        id: mode
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          REFRESH_PROMPT: ${{ inputs.refresh_prompt }}
        run: |
          mode="${REQUESTED_MODE:-auto}"
          if [ "$mode" = auto ] && [ -f state/meta.json ] && [ "$(date -u +%u%H)" = 718 ]; then
            mode=weekly
          fi
          arguments=''
          if [ "$mode" != auto ]; then
            arguments="--mode $mode"
          fi
          if [ "$REFRESH_PROMPT" = true ]; then
            arguments="$arguments --refresh-prompt"
          fi
          echo "arguments=$arguments" >> "$GITHUB_OUTPUT"

      # 작업 제한보다 먼저 끊어, 중간 저장한 상태를 커밋할 시간을 남긴다.
      - name: Collect, summarize, export
        timeout-minutes: 320
        env:
          GH_SEARCH_TOKEN: ${{ secrets.GH_SEARCH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODE_ARGUMENTS: ${{ steps.mode.outputs.arguments }}
        # shellcheck disable=SC2086
        run: uv run python -m collector $MODE_ARGUMENTS

      - name: Report metrics
        if: always()
        run: |
          [ -f build/metrics/latest.json ] || exit 0
          {
            echo '### 실행 지표'
            echo '```json'
            cat build/metrics/latest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: run-metrics
          path: collector/build/metrics/latest.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Commit data
        if: ${{ !cancelled() }}
        working-directory: .
        run: |
          git add collector/state site/src/data/skills.json
          # 수집이 중간에 끊겨도 다음 실행이 이어받도록 상태는 남긴다.
          if git diff --cached --quiet; then
            echo '변경 사항이 없습니다.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update skill data for $(date -u +%F)"
          git pull --rebase
          git push
