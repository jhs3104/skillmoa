# 수집·요약 설정. 비밀값은 여기에 두지 않고 환경변수로만 읽는다.

[discovery]
seed_repositories = ["anthropics/skills"]
marketplaces = ["anthropics/skills"]
awesome_lists = [
  "hesreallyhim/awesome-claude-code",
  "travisvn/awesome-claude-skills",
  "VoltAgent/awesome-agent-skills",
]
topics = ["claude-skills", "agent-skills", "claude-code-skills", "claude-code", "codex-skills"]
search_pages_per_topic = 3
code_search_max_size = 200000

[filter]
min_body_chars = 200

[ranking]
star_decay = 0.7
per_repository_cap = 10
# 사이트에 싣는 최대 스킬 수. 상한은 19,000 (ADR-0011).
catalog_limit = 19000

[github]
# 스캔이 요약 시간까지 잡아먹지 않게 멈춘다. 남은 저장소는 다음 실행이 이어받는다.
max_scan_minutes = 120
max_wait_seconds_with_token = 3700
max_wait_seconds_anonymous = 60

[summary]
model = "claude-haiku-5-5"
prompt_version = "v6"
effort = "medium"
max_calls_per_day = 8000
# 예약 실행이 자주 빠져서(첫날 7번 중 3번 실행) 한 번에 더 처리한다. 약 1시간 20분 걸린다.
max_calls_per_run = 2500
max_output_tokens = 4000
max_source_chars = 200000
timeout_seconds = 60
validation_attempts = 3
concurrency = 4

[classify]
model = "claude-haiku-5-5"
taxonomy_version = "t2"
effort = "medium"
max_calls_per_day = 8000
max_calls_per_run = 3000
max_output_tokens = 2000
timeout_seconds = 60
validation_attempts = 2
concurrency = 4

# 소식 페이지의 도구 업데이트 요약 (ADR-0022). 도구별로 하루 한 번이라 호출이 적다.
[news]
model = "claude-haiku-5-5"
prompt_version = "n1"
effort = "low"
max_calls_per_day = 60
max_calls_per_run = 40
max_output_tokens = 1000
max_source_chars = 12000
timeout_seconds = 60
validation_attempts = 2
window_days = 30
keep_days = 60

# 사이트에서 뺄 스킬을 사람이 정한다 (ADR-0020). 수집과 요약은 그대로 하고 내보낼 때만 뺀다.
[exclude]
repositories = [
  # 예전 스킬이 옮겨졌다는 안내 페이지만 모아 둔 저장소
  "majiayu000/claude-skill-registry",
  # 한 나라 전용 (ADR-0021): 독일 약관법, 프랑스 세무·공증·회계, 베트남 법령
  "Klotzkette/claude-fuer-deutsches-recht",
  "romainsimon/paperasse",
  "mhfed/vn-law-check",
  # 중국에서만 쓰는 서비스 전용: 위챗 공식 계정, 중국 인터넷 검색, Feishu 문서, 샤오훙슈·위챗 카드, 중국 플랫폼 30일 동향
  "geekjourneyx/md2wechat-skill",
  "geekjourneyx/tanso",
  "leemysw/feishu-docx",
  "op7418/guizang-social-card-skill",
  "Jesseovo/last30days-skill-cn",
]
# 뺄 스킬. "owner/repo:path"
skills = [
  # Claude Code 사용법 예제 저장소의 견본: 파키스탄·두바이 시각과 날씨, 그 값을 그리는 부품
  "shanraisshan/claude-code-best-practice:.claude/skills/time-skill/SKILL.md",
  "shanraisshan/claude-code-best-practice:.claude/skills/weather-fetcher/SKILL.md",
  "shanraisshan/claude-code-best-practice:.claude/skills/weather-svg-creator/SKILL.md",
  "shanraisshan/claude-code-best-practice:agent-teams/.claude/skills/time-fetcher/SKILL.md",
  "shanraisshan/claude-code-best-practice:agent-teams/.claude/skills/time-svg-creator/SKILL.md",
  # 중국에서만 쓰는 서비스 전용: 위안바오 그룹 채팅, Feishu 답변 규칙, Bilibili, 샤오훙슈 카드
  "nousresearch/hermes-agent:optional-skills/yuanbao/SKILL.md",
  "op7418/codepilot:资料/feishu-openclaw-plugin/package/skills/feishu-channel-rules/SKILL.md",
  "imoonkey/openweb:src/sites/bilibili/SKILL.md",
  "oyorf/quiet-signal:skills/quiet-signal-xhs/SKILL.md",
]
# 분류 호출이 빼자고 했지만 남길 스킬. "owner/repo:path"
keep = []
