# 수집·요약 설정. 비밀값은 여기에 두지 않고 환경변수로만 읽는다.

[discovery]
seed_repositories = ["anthropics/skills"]
marketplaces = ["anthropics/skills"]
awesome_lists = [
  "hesreallyhim/awesome-claude-code",
  "travisvn/awesome-claude-skills",
  "VoltAgent/awesome-agent-skills",
]
topics = ["claude-skills", "agent-skills", "claude-code-skills", "claude-code", "codex-skills"]
search_pages_per_topic = 3
code_search_max_size = 200000

[filter]
min_body_chars = 200

[ranking]
star_decay = 0.7
per_repository_cap = 10
# 사이트에 싣는 최대 스킬 수. 상한은 19,000 (ADR-0011).
catalog_limit = 19000

[github]
# 스캔이 요약 시간까지 잡아먹지 않게 멈춘다. 남은 저장소는 다음 실행이 이어받는다.
max_scan_minutes = 120
max_wait_seconds_with_token = 3700
max_wait_seconds_anonymous = 60

[summary]
model = "claude-haiku-5-5"
prompt_version = "v6"
effort = "medium"
max_calls_per_day = 8000
# 예약 실행이 자주 빠져서(첫날 7번 중 3번 실행) 한 번에 더 처리한다. 약 1시간 20분 걸린다.
max_calls_per_run = 2500
max_output_tokens = 4000
max_source_chars = 200000
timeout_seconds = 60
validation_attempts = 3
concurrency = 4

[classify]
model = "claude-haiku-5-5"
taxonomy_version = "t2"
effort = "medium"
max_calls_per_day = 8000
max_calls_per_run = 3000
max_output_tokens = 2000
timeout_seconds = 60
validation_attempts = 2
concurrency = 4

# 사이트에서 뺄 스킬을 사람이 정한다 (ADR-0020). 수집과 요약은 그대로 하고 내보낼 때만 뺀다.
[exclude]
# 예전 스킬이 옮겨졌다는 안내 페이지만 모아 둔 저장소
repositories = ["majiayu000/claude-skill-registry"]
# 뺄 스킬. "owner/repo:path"
skills = []
# 분류 호출이 빼자고 했지만 남길 스킬. "owner/repo:path"
keep = []
